server:
  port: 9020
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension},optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  application:
    name: firefly-device
  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.123.102:5432/firefly_iot
    username: firefly
    password: firefly123
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  data:
    redis:
      host: 192.168.123.102
      port: 6379
      password: ''
      database: 0

  kafka:
    # 优先读取部署环境注入的地址；缺省指向本机单 broker，便于本地开发
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # acks=all 要求 ISR 全部副本落盘确认，避免 broker 故障丢失已确认消息
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 幂等生产者：broker 端按 producer id + 序列号去重，配合 acks=all/retries 避免重复写入
        enable.idempotence: true
        # 幂等生产者要求 in-flight 请求 <= 5；超过会打破单分区写入顺序
        max.in.flight.requests.per.connection: 5
        # 单条消息从 send 到最终失败的总超时，需大于 retries 次重试的累计时间
        delivery.timeout.ms: 120000
    consumer:
      group-id: firefly-device
      auto-offset-reset: earliest
      # 单次 poll 最多拉取条数，控制单批处理耗时，避免触发 max.poll.interval.ms 再平衡
      max-poll-records: 200
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # 单批处理时间上限（5 分钟）；超时未 poll 会被踢出消费组并触发再平衡
        max.poll.interval.ms: 300000
    listener:
      # 每个 @KafkaListener 的并发消费线程数；可由部署环境按分区数调整
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:2}
      # 单条记录处理成功后立即提交 offset，避免批内部分失败时整批重复消费
      ack-mode: record

  flyway:
    connect-retries: ${FLYWAY_CONNECT_RETRIES:30}
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_device_history

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.123.102:8848
        namespace: firefly-dev
      config:
        server-addr: 192.168.123.102:8848
        namespace: firefly-dev
        file-extension: yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.songhg.firefly.iot.common.mybatis

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: ${FIREFLY_TRACING_ENABLED:false}
    sampling:
      probability: ${FIREFLY_TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${FIREFLY_OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}



firefly:
  internal:
    token: ${FIREFLY_INTERNAL_TOKEN:firefly-internal-dev}
  telemetry:
    # 全局默认保留天数，未单独配置的租户使用该值
    default-retention-days: ${FIREFLY_TELEMETRY_DEFAULT_RETENTION_DAYS:90}
    # 租户可设置的最大保留天数，需与迁移脚本中的全局 drop_chunks 上限保持一致
    global-max-retention-days: ${FIREFLY_TELEMETRY_GLOBAL_MAX_RETENTION_DAYS:365}
    # 过期数据清理任务执行时间（默认每日 03:10）
    retention-cleanup-cron: "${FIREFLY_TELEMETRY_RETENTION_CLEANUP_CRON:0 10 3 * * ?}"
  # OTA 固件签名校验：配置后固件可携带 RSA-SHA256 签名
  ota:
    signature-public-key: ${FIREFLY_OTA_SIGNATURE_PUBLIC_KEY:}
    signature-algorithm: ${FIREFLY_OTA_SIGNATURE_ALGORITHM:SHA256withRSA}
  metrics:
    # 按租户在线设备指标的刷新间隔（毫秒）
    device-online-refresh-interval-ms: ${FIREFLY_METRICS_DEVICE_ONLINE_REFRESH_INTERVAL_MS:30000}
  shadow:
    # 影子 Redis 缓存 TTL（天）；desired 权威副本在数据库
    redis-ttl-days: ${FIREFLY_SHADOW_REDIS_TTL_DAYS:7}
    # 设备级 Redis 锁 TTL（毫秒）
    lock-ttl-ms: ${FIREFLY_SHADOW_LOCK_TTL_MS:3000}
  logs:
    # 设备日志保留天数，定时任务按 created_at 清理更早的数据
    device-log-retention-days: ${FIREFLY_LOGS_DEVICE_LOG_RETENTION_DAYS:30}
    # 设备事件保留天数，定时任务按 created_at 清理更早的数据
    device-event-retention-days: ${FIREFLY_LOGS_DEVICE_EVENT_RETENTION_DAYS:90}
    # 设备日志/设备事件保留清理任务执行时间（默认每日 03:20）
    retention-cleanup-cron: "${FIREFLY_LOGS_RETENTION_CLEANUP_CRON:0 20 3 * * ?}"
