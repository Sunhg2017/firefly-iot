route:
  receiver: default-receiver
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # 默认仅记录告警；接入企业微信/钉钉/邮件时替换为对应 webhook 配置。
  - name: default-receiver
    webhook_configs:
      - url: 'http://127.0.0.1:5001/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']
