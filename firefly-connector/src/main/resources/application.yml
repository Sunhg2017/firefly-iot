server:
  port: 9070
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension},optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  application:
    name: firefly-connector
  profiles:
    active: dev

  data:
    redis:
      host: 192.168.123.102
      port: 6379
      password: ''
      database: 0

  kafka:
    # 优先读取部署环境注入的地址；缺省指向本机单 broker，便于本地开发
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # acks=all 要求 ISR 全部副本落盘确认，避免 broker 故障丢失已确认消息
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 幂等生产者：broker 端按 producer id + 序列号去重，配合 acks=all/retries 避免重复写入
        enable.idempotence: true
        # 幂等生产者要求 in-flight 请求 <= 5；超过会打破单分区写入顺序
        max.in.flight.requests.per.connection: 5
        # 单条消息从 send 到最终失败的总超时，需大于 retries 次重试的累计时间
        delivery.timeout.ms: 120000
    consumer:
      group-id: firefly-connector
      # 单次 poll 最多拉取条数，控制单批处理耗时，避免触发 max.poll.interval.ms 再平衡
      max-poll-records: 200
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # 单批处理时间上限（5 分钟）；超时未 poll 会被踢出消费组并触发再平衡
        max.poll.interval.ms: 300000
    listener:
      # 每个 @KafkaListener 的并发消费线程数；可由部署环境按分区数调整
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:2}
      # 单条记录处理成功后立即提交 offset，避免批内部分失败时整批重复消费
      ack-mode: record

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.123.102:8848
        namespace: firefly-dev
      config:
        server-addr: 192.168.123.102:8848
        namespace: firefly-dev
        file-extension: yml

# 鍗忚閰嶇疆
firefly:
  internal:
    token: ${FIREFLY_INTERNAL_TOKEN:firefly-internal-dev}
  http:
    presence-timeout-seconds: 300
    presence-sweep-interval-seconds: 30

  downlink:
    # 设备离线/无路由时下行消息的待投递队列：按设备有界、按消息去重、带 TTL
    pending-max-per-device: ${FIREFLY_DOWNLINK_PENDING_MAX_PER_DEVICE:100}
    pending-ttl-hours: ${FIREFLY_DOWNLINK_PENDING_TTL_HOURS:24}
    seen-ttl-minutes: ${FIREFLY_DOWNLINK_SEEN_TTL_MINUTES:60}
    flush-batch-size: ${FIREFLY_DOWNLINK_FLUSH_BATCH_SIZE:50}

  mqtt:
    enabled: true
    host: 0.0.0.0
    port: 1883
    # TLS 监听（默认关闭）：生产环境建议启用，避免设备口令明文过网。
    # 启用后 1883 明文端口是否保留由部署层决定（可只暴露 8883）。
    ssl-enabled: ${FIREFLY_MQTT_SSL_ENABLED:false}
    ssl-port: ${FIREFLY_MQTT_SSL_PORT:8883}
    key-store-type: ${FIREFLY_MQTT_KEY_STORE_TYPE:JKS}
    key-store-path: ${FIREFLY_MQTT_KEY_STORE_PATH:}
    key-store-password: ${FIREFLY_MQTT_KEY_STORE_PASSWORD:}
    key-manager-password: ${FIREFLY_MQTT_KEY_MANAGER_PASSWORD:}
    # 双向认证（mTLS）：NONE=仅服务端证书；OPTIONAL=请求但不强制客户端证书；REQUIRE=强制客户端证书。
    client-auth: ${FIREFLY_MQTT_CLIENT_AUTH:NONE}
    trust-store-type: ${FIREFLY_MQTT_TRUST_STORE_TYPE:JKS}
    trust-store-path: ${FIREFLY_MQTT_TRUST_STORE_PATH:}
    trust-store-password: ${FIREFLY_MQTT_TRUST_STORE_PASSWORD:}
    # 允许的 TLS 协议版本，逗号分隔；默认只允许 TLSv1.2/TLSv1.3。
    protocols: ${FIREFLY_MQTT_PROTOCOLS:TLSv1.2,TLSv1.3}
    allow-anonymous: false
    persistence-enabled: false
    data-path: data/mqtt
    max-message-size: 65536
    route-ttl-seconds: 120
    route-refresh-interval-seconds: 30
    node-heartbeat-ttl-seconds: 45
    node-heartbeat-interval-seconds: 15
    downstream-qos: 1
    relay-channel-prefix: "connector:mqtt:downstream:"

  coap:
    enabled: false
    port: 5683
    secure-port: 5684
    max-message-size: 1024
    block-size: 512
    dtls-enabled: false

  snmp:
    enabled: true
    retries: 2
    timeout-ms: 3000
    trap:
      enabled: true
      listen-address: 0.0.0.0
      port: 162
    collector:
      enabled: true
      pool-size: 5
      default-interval-ms: 60000

  modbus:
    enabled: true
    collector:
      enabled: true
      pool-size: 5
      default-interval-ms: 60000

  websocket:
    enabled: true
    path: /ws/device
    allowed-origins: "*"
    max-text-message-size: 65536
    max-binary-message-size: 65536
    idle-timeout-ms: 300000

  tcp-udp:
    enabled: true
    tcp-enabled: true
    tcp-port: 8900
    udp-enabled: true
    udp-port: 8901
    tcp-frame-decoder: LINE
    tcp-delimiter: "\n"
    max-frame-length: 65536
    idle-timeout-sec: 300
    boss-threads: 1
    worker-threads: 0
    so-backlog: 128

  lorawan:
    enabled: true
    network-server: CHIRPSTACK
    api-url: http://localhost:8080
    api-token: ""
    webhook-path: /api/v1/lorawan/webhook
    payload-codec: JSON
    application-id: ""
    downlink-class: CLASS_A
    downlink-f-port: 1
    downlink-confirmed: false
    deduplication-window-ms: 5000

# SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: ${FIREFLY_TRACING_ENABLED:false}
    sampling:
      probability: ${FIREFLY_TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${FIREFLY_OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}

